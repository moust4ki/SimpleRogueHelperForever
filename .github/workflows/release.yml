# Release: on every version tag (v1.0.0, v1.1.0-beta1...), build the zip,
# create the GitHub release and upload the file to CurseForge, with this
# version's notes from CHANGELOG.md.
#
# Needs the CF_API_KEY secret (CurseForge API token). Optional repository
# variables: CF_GAME_VERSION (default 1.60.1) or CF_GAME_VERSION_ID.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_GAME_VERSION: ${{ vars.CF_GAME_VERSION }}
      CF_GAME_VERSION_ID: ${{ vars.CF_GAME_VERSION_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the version
        run: python tools/release.py check "$GITHUB_REF_NAME"

      # A version whose tests fail is never released
      - name: Tests
        run: |
          python -m pip install --quiet "lupa==2.8"
          python tests/run_all.py
          python -m unittest discover -s tools -p "test_*.py"

      - name: Build the zip
        run: |
          python tools/package.py
          python tools/release.py notes > dist/notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/SimpleRogueHelperForever-*.zip \
            --title "SimpleRogueHelper - Forever $version" --notes-file dist/notes.md $prerelease

      - name: CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: python tools/release.py curseforge
